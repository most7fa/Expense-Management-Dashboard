<div class="min-h-screen flex flex-column">
  <!-- Top Navigation Bar -->
  <header class="surface-card px-4 py-3 flex justify-content-between align-items-center border-bottom-1 border-200 sticky top-0 z-5">
    <div class="flex align-items-center gap-3">
      <button pButton icon="pi pi-bars" class="p-button-text p-button-rounded lg:hidden" (click)="toggleMobileMenu()"></button>
      <div class="flex align-items-center gap-2">
        <i class="pi pi-wallet text-primary text-3xl"></i>
        <span class="text-xl font-bold text-900">ExpenseTracker</span>
      </div>
    </div>

    <div class="flex align-items-center gap-3">
      <div class="hidden sm:flex align-items-center gap-2 text-600">
        <i class="pi pi-building"></i>
        <span class="font-medium text-sm">Acme Corp Ltd.</span>
      </div>
      <div class="w-2rem h-2rem border-circle bg-primary-100 text-primary flex align-items-center justify-content-center font-bold text-sm">
        AC
      </div>
    </div>
  </header>

  <div class="flex flex-1">
    <!-- Sidebar Navigation -->
    <aside 
      class="surface-card border-right-1 border-200 w-16rem flex-shrink-0 lg:block p-3"
      [class.hidden]="!isMobileMenuOpen"
      [class.block]="isMobileMenuOpen">
      
      <ul class="list-none p-0 m-0">
        <li class="mb-2">
          <a 
            routerLink="/dashboard" 
            routerLinkActive="bg-primary-50 text-primary font-bold" 
            class="flex align-items-center gap-3 px-3 py-2 border-round text-700 hover:surface-100 transition-duration-150 cursor-pointer no-underline"
            (click)="isMobileMenuOpen = false">
            <i class="pi pi-home text-lg"></i>
            <span>Dashboard</span>
          </a>
        </li>
        <li class="mb-2">
          <a 
            routerLink="/expenses" 
            routerLinkActive="bg-primary-50 text-primary font-bold" 
            class="flex align-items-center gap-3 px-3 py-2 border-round text-700 hover:surface-100 transition-duration-150 cursor-pointer no-underline"
            (click)="isMobileMenuOpen = false">
            <i class="pi pi-receipt text-lg"></i>
            <span>Expenses</span>
          </a>
        </li>
      </ul>
    </aside>

    <!-- Main Content Area -->
    <main class="flex-1 p-4 md:p-5 overflow-y-auto">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
