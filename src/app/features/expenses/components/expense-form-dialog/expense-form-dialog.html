<p-dialog [header]="expense ? 'Edit expense' : 'Add expense'" [(visible)]="visible" (onHide)="visibleChange.emit(false)" [modal]="true" [draggable]="false" [resizable]="false" [style]="{width:'min(620px, 94vw)'}">
  <p class="form-intro">Enter the expense information below. Fields marked * are required.</p>
  <div class="form-error" *ngIf="error">{{ error }}</div>
  <form [formGroup]="form" (ngSubmit)="submit()" class="expense-form">
    <div class="field full"><label for="description">Description <span>*</span></label><input id="description" pInputText formControlName="description" placeholder="e.g. Office rent" /><small class="field-error" *ngIf="invalid('description')">Please enter a description (maximum 120 characters).</small></div>
    <div class="field"><label for="amount">Amount (EGP) <span>*</span></label><p-inputnumber inputId="amount" formControlName="amount" mode="decimal" [min]="0.01" [minFractionDigits]="2" [maxFractionDigits]="2" placeholder="0.00" styleClass="w-full" /></div>
    <div class="field"><label for="category">Category <span>*</span></label><p-select inputId="category" formControlName="category" [options]="categories" optionLabel="label" optionValue="value" placeholder="Choose category" appendTo="body" styleClass="w-full" /></div>
    <small class="field-error" *ngIf="invalid('amount')">Amount must be greater than zero.</small>
    <small class="field-error" *ngIf="invalid('category')">Choose a category.</small>
    <div class="field"><label for="date">Date <span>*</span></label><p-datepicker inputId="date" formControlName="date" dateFormat="dd/mm/yy" [showIcon]="true" [maxDate]="null" appendTo="body" styleClass="w-full" /></div>
    <div class="field"><label for="paymentMethod">Payment method <span>*</span></label><p-select inputId="paymentMethod" formControlName="paymentMethod" [options]="paymentMethods" optionLabel="label" optionValue="value" placeholder="Choose method" appendTo="body" styleClass="w-full" /></div>
    <small class="field-error" *ngIf="invalid('date')">Choose a valid date.</small><small class="field-error" *ngIf="invalid('paymentMethod')">Choose a payment method.</small>
    <div class="field full"><label for="notes">Notes</label><textarea id="notes" pTextarea formControlName="notes" rows="3" placeholder="Optional details…" class="notes-input"></textarea><small class="field-error" *ngIf="invalid('notes')">Notes must be 1000 characters or fewer.</small></div>
    <div class="form-actions"><p-button label="Cancel" severity="secondary" [outlined]="true" type="button" (onClick)="close()" /><p-button [label]="expense ? 'Save changes' : 'Add expense'" icon="pi pi-check" type="submit" [loading]="saving" /></div>
  </form>
</p-dialog>
