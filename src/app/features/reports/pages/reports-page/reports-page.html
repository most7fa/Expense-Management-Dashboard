<section class="page-heading"><div><p class="eyebrow">ANALYTICS</p><h1>Reports</h1><p class="muted">Understand where the company budget is going.</p></div></section>
<div class="report-summary"><span>Total recorded spending</span><strong>{{ total | currency:'EGP':'symbol':'1.0-0' }}</strong></div>
<div class="report-grid"><article class="report-panel"><h2>Monthly expenses</h2><p>Spending over the last six months</p><div class="chart"><p-chart type="bar" [data]="monthlyData" [options]="options" *ngIf="monthlyData; else loadingState" /></div></article><article class="report-panel"><h2>Category breakdown</h2><p>Spending by category</p><div class="chart"><p-chart type="doughnut" [data]="categoryData" [options]="options" *ngIf="categoryData; else loadingState" /></div></article></div>
<ng-template #loadingState><div class="loading">Preparing report…</div></ng-template>
